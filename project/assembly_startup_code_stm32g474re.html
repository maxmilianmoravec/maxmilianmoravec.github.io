<!--

Standard project creation procedure

1. Create copy of /project/project_template.html in /project and rename it
2. Add proper record into /public/sitemap.xml
3. Change title to "{project_name} | Maxmilián Moravec"
4. Set date to current date
5. Fill content section with header, second headers and paragraphs / code
6. Set meta description to a 1-2 sentence summary of the project
7. Set canonical + og:url to the final /project/{filename}.html URL
8. Set og:title to match <title>, og:image to a relevant project image (or fallback to profile pic)

-->
